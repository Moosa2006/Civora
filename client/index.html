<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/cevora_icon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Civora - Civic Issue Reporting and Public Accountability Platform" />
  <title>Civora — Civic Reporting & Accountability</title>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('civora_theme');
        var prefersDark =
          window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var resolved =
          saved === 'dark' || saved === 'light' ? saved : prefersDark ? 'dark' : 'light';
        var root = document.documentElement;
        root.dataset.theme = resolved;
        root.classList.toggle('dark', resolved === 'dark');
      } catch (e) {}
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
